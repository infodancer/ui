name: govulncheck
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    strategy:
      matrix:
        module: [".", "markdown", "mdedit"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Pinned to 1.26.4 to pick up the crypto/x509 stdlib fix for
          # GO-2026-5037 (govulncheck flags it on the root module via a
          # fmt.Sprintf → x509.HostnameError.Error trace). `stable` still
          # resolves to the vulnerable 1.26.3 because the actions/go-versions
          # manifest lags the release; setup-go fetches 1.26.4 from the Go dist
          # directly. Bump to a newer patch (or back to `stable`) once the
          # manifest catches up.
          go-version: "1.26.4"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
