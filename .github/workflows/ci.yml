name: CI

# Thin caller: the static-analysis quartet (vet/fmt/lint/govulncheck) lives in
# infodancer/workflows. Tests stay in test.yml because they cover a different
# module set (the mdedit spike example) than lint/govulncheck do.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    uses: infodancer/workflows/.github/workflows/go-ci.yml@v0
    with:
      # The two in-repo examples are modules of their own, with a filesystem
      # replace back to the tree. Left out of this list they are built by
      # nothing: examples/go-consumer had been broken since the root module's
      # go directive moved past the one it declared, and no run went red --
      # the same shape as infodancer/web#111.
      modules: '[".", "markdown", "mdedit", "examples/go-consumer", "mdedit/examples/spike"]'
      run_tests: false
